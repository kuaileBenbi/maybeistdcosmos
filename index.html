<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红外小目标检测索引</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./assets/istd.css">
</head>
<body class="home-mindmap-page">
    <div class="site-bg-orbs">
        <div class="site-bg-orb site-bg-orb--left"></div>
        <div class="site-bg-orb site-bg-orb--right"></div>
        <div class="site-bg-orb site-bg-orb--bottom"></div>
    </div>

    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-10">

        <section id="modulesSection" class="mt-8 grid gap-6 xl:grid-cols-[minmax(0,1fr)_22rem]">
            <div class="glass-panel mindmap-panel rounded-[2rem] p-5 sm:p-7 lg:p-8">
                <div id="moduleCards"></div>
            </div>
            <aside id="resourcePanel" class="glass-panel resource-panel rounded-[2rem] p-5 sm:p-6"></aside>
        </section>

        <section class="mt-10 grid gap-6 xl:grid-cols-[1.02fr_0.98fr]">
            <section id="searchSection" class="glass-panel rounded-[2rem] p-6 sm:p-7">
                <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">关键词检索</div>
                <div class="relative mt-4">
                    <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-4 top-4 text-sm text-slate-500"></i>
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="论文 / 年份 / 期刊 / 方向"
                        class="w-full rounded-2xl border border-white/10 bg-slate-900/90 px-4 py-3 pl-11 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-400/50 focus:ring-2 focus:ring-cyan-400/10">
                </div>
                <p id="searchMeta" class="mt-3 text-xs leading-6 text-slate-500">DNANet / TGRS / 多帧 / 传统方法</p>
                <div id="searchResults" class="search-scroll mt-5 max-h-[30rem] space-y-2 overflow-y-auto pr-1"></div>
            </section>

            <section class="glass-panel rounded-[2rem] p-6 sm:p-7">
                <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">按年份浏览</div>
                <h2 class="mt-3 text-2xl font-semibold">近年论文</h2>
                <div id="latestPapers" class="mt-6 grid gap-4 lg:grid-cols-2"></div>
            </section>
        </section>
    </main>

    <button onclick="scrollToSection('top')" class="fixed bottom-5 right-5 z-30 inline-flex items-center gap-2 rounded-full border border-white/10 bg-[rgba(8,15,26,0.88)] px-4 py-3 text-sm font-medium text-slate-100 shadow-[0_18px_36px_rgba(2,8,20,0.28)] backdrop-blur-xl transition hover:border-cyan-400/40 hover:text-white">
        <i class="fa-solid fa-arrow-up"></i>
        回到顶部
    </button>

    <script src="./assets/fallback-data.js"></script>
    <script src="./assets/home-page.js"></script>
</body>
</html>
