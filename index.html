<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红外小目标检测索引</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="./assets/istd.css">
</head>
<body class="home-mindmap-page">
    <div class="site-bg-orbs">
        <div class="site-bg-orb site-bg-orb--left"></div>
        <div class="site-bg-orb site-bg-orb--right"></div>
        <div class="site-bg-orb site-bg-orb--bottom"></div>
    </div>

    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-10">
        <section class="text-center py-12 sm:py-20">
            
            <h1 class="text-5xl sm:text-6xl lg:text-7xl font-bold tracking-tighter leading-none">
                红 外 小 目 标 检 测 研 究
            </h1>
            
            <p class="mt-8 text-xl text-zinc-600 dark:text-zinc-400 max-w-xl mx-auto">
                · 从传统方法、优化建模到深度网络与资源基准
            </p>
        </section>

        <section id="modulesSection" class="mt-8 grid gap-6 xl:grid-cols-[minmax(0,1fr)_22rem]">
            <div class="glass-panel mindmap-panel rounded-[2rem] p-5 sm:p-7 lg:p-8">
                <div id="moduleCards"></div>
            </div>
            <aside id="resourcePanel" class="glass-panel resource-panel rounded-[2rem] p-5 sm:p-6"></aside>
        </section>

        <section class="mt-10 grid gap-6 xl:grid-cols-[1.02fr_0.98fr]">
            <section id="searchSection" class="glass-panel rounded-[2rem] p-6 sm:p-7">
                <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">关键词检索</div>
                <div class="relative mt-4">
                    <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-4 top-4 text-sm text-slate-500"></i>
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="论文 / 年份 / 期刊 / 方向"
                        class="w-full rounded-2xl border border-white/10 bg-slate-900/90 px-4 py-3 pl-11 text-sm text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-400/50 focus:ring-2 focus:ring-cyan-400/10">
                </div>
                <p id="searchMeta" class="mt-3 text-xs leading-6 text-slate-500">DNANet / TGRS / 多帧 / 传统方法</p>
                <div id="searchResults" class="search-scroll mt-5 max-h-[30rem] space-y-2 overflow-y-auto pr-1"></div>
            </section>

            <section class="glass-panel rounded-[2rem] p-6 sm:p-7">
                <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">按年份浏览</div>
                <h2 class="mt-3 text-2xl font-semibold">近年论文</h2>
                <div id="latestPapers" class="mt-6 grid gap-4 lg:grid-cols-2"></div>
            </section>
        </section>

        <section id="benchmarkSection" class="mt-10 grid gap-6 xl:grid-cols-[minmax(0,1.08fr)_22rem]">
            <section class="glass-panel benchmark-panel rounded-[2rem] p-6 sm:p-7">
                <div class="benchmark-panel__head">
                    <div>
                        <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Benchmark Spotlight</div>
                        <h2 class="mt-3 text-2xl font-semibold">统一评测曲线与指标</h2>
                    </div>
                    <a id="benchmarkSourceLink" href="https://github.com/kuaileBenbi/BasicIRSTD" target="_blank" rel="noreferrer" class="resource-panel__entry-link">
                        BasicIRSTD
                    </a>
                </div>

                <div id="benchmarkSummaryChips" class="benchmark-summary-chips mt-5"></div>
                <div id="benchmarkControls" class="benchmark-controls mt-5"></div>
                <div id="benchmarkChartState" class="benchmark-empty hidden mt-5"></div>
                <div id="benchmarkChart" class="benchmark-chart mt-5"></div>
            </section>

            <aside class="glass-panel benchmark-side rounded-[2rem] p-5 sm:p-6">
                <div class="resource-panel__eyebrow">Leaderboard</div>
                <h3 class="mt-3 text-2xl font-semibold">Top Methods</h3>
                <div id="benchmarkLeaderboard" class="benchmark-rank-list mt-5"></div>
            </aside>
        </section>
    </main>

    <footer class="site-watermark">
        <div class="site-watermark__inner">
            <span class="site-watermark__label">Created by</span>
            <span class="site-watermark__name">kuailebenbi</span>
            <a class="site-watermark__link" href="https://github.com/kuaileBenbi/maybeistdcosmos" target="_blank" rel="noreferrer" aria-label="Visit maybeistdcosmos on GitHub">
                <span class="site-watermark__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                        <path d="M12 .5C5.65.5.5 5.65.5 12A11.5 11.5 0 0 0 8.36 22.1c.58.11.79-.25.79-.56v-2.02c-3.18.69-3.85-1.35-3.85-1.35-.52-1.31-1.26-1.66-1.26-1.66-1.03-.7.08-.69.08-.69 1.14.08 1.73 1.16 1.73 1.16 1.01 1.74 2.66 1.23 3.31.94.1-.73.4-1.23.72-1.52-2.54-.29-5.22-1.27-5.22-5.64 0-1.25.45-2.27 1.17-3.07-.12-.29-.51-1.47.11-3.07 0 0 .96-.31 3.14 1.17a10.9 10.9 0 0 1 5.72 0c2.18-1.48 3.14-1.17 3.14-1.17.62 1.6.23 2.78.11 3.07.73.8 1.17 1.82 1.17 3.07 0 4.38-2.68 5.35-5.24 5.64.41.36.78 1.07.78 2.17v3.22c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"></path>
                    </svg>
                </span>
                <span class="site-watermark__repo">maybeistdcosmos</span>
            </a>
        </div>
    </footer>

    <button onclick="scrollToSection('top')" class="fixed bottom-5 right-5 z-30 inline-flex items-center gap-2 rounded-full border border-white/10 bg-[rgba(8,15,26,0.88)] px-4 py-3 text-sm font-medium text-slate-100 shadow-[0_18px_36px_rgba(2,8,20,0.28)] backdrop-blur-xl transition hover:border-cyan-400/40 hover:text-white">
        <i class="fa-solid fa-arrow-up"></i>
        回到顶部
    </button>

    <script src="./assets/fallback-data.js"></script>
    <script src="./assets/fallback-benchmark-data.js"></script>
    <script src="./assets/home-page.js"></script>
</body>
</html>
