name: Sync Infrared Research Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync README data
        run: python scripts/sync_awesome_readme.py

      - name: Sync arXiv watch
        continue-on-error: true
        run: python scripts/sync_arxiv_watch.py

      - name: Commit changes
        run: |
          if git diff --quiet -- infrared-mindmap-data.json assets/fallback-data.js; then
            echo "No data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrared-mindmap-data.json assets/fallback-data.js
          git commit -m "chore: sync infrared research data"
          git push

      - name: Send email notification
        if: ${{ hashFiles('new-papers-summary.html') != '' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[IRSTD Watch] 发现新的红外小目标检测论文"
          to: lovelyleeyahoo@gmail.com
          from: IRSTD Paper Watcher
          html_body: file://new-papers-summary.html
